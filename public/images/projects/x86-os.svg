  <text x="184" y="91" fill="#aeb9b5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="2">X86-OS  /  KERNEL VIEW</text>

  <text x="102" y="184" fill="#f6f4ee" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="650" letter-spacing="-2">A small OS,</text>
