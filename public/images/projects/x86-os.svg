  <text x="104" y="274" fill="#aab3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="1.3">32-BIT X86  ·  C  ·  QEMU</text>

  <rect x="102" y="318" width="516" height="300" rx="16" fill="#111719" stroke="#58605d" stroke-opacity=".6"/>
