  <text x="126" y="347" fill="#8d9a94" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">BOOT CONSOLE</text>
  <text x="128" y="405" fill="#e9c351" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">kernel@x86:~$ boot</text>
  <text x="128" y="443" fill="#b8c1bb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">paging ........ enabled</text>
  <text x="128" y="478" fill="#b8c1bb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">scheduler ..... ready</text>
  <text x="128" y="513" fill="#b8c1bb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">processes ..... 03</text>
  <text x="128" y="566" fill="#89c5a2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">haibo-os&gt; _</text>
  <rect x="255" y="551" width="10" height="21" rx="2" fill="#e9c351" opacity=".88"/>

  <text x="700" y="346" fill="#aab3af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="1.4">VIRTUAL ADDRESS SPACE</text>
